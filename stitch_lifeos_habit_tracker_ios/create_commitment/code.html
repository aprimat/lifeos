<div class="flex flex-col gap-space-sm">

<div class="flex flex-col gap-1 min-w-0">

</div>

</button>
<button class="approach-card bg-surface-container-lowest rounded-xl p-space-md flex items-start justify-between gap-space-md text-left shadow-[0_2px_8px_rgba(0,0,0,0.03)] transition-all active:scale-[0.99]" data-approach="custom" type="button">
<div class="flex flex-col gap-1 min-w-0">
<span class="font-label-lg text-label-lg text-on-surface">Build my own</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Define your own habits and daily rhythm from scratch</span>
</div>

<script>
  (function () {
    const durationCards = document.querySelectorAll('.duration-card');
    const durationSecondary = document.querySelectorAll('.duration-secondary');

    function resetDurationSelection() {
      durationCards.forEach((card) => {
        card.classList.remove('bg-primary-fixed/40', 'shadow-[0_2px_8px_rgba(53,107,219,0.12)]');
        card.classList.add('bg-surface-container-lowest', 'shadow-[0_2px_8px_rgba(0,0,0,0.03)]');
        const title = card.querySelector('span:first-child');
        const sub = card.querySelector('span:last-child');
        if (title) {
          title.classList.remove('text-on-primary-fixed');
          title.classList.add('text-on-surface');
        }
        if (sub) {
          sub.classList.remove('text-on-primary-fixed-variant');
          sub.classList.add('text-on-surface-variant');
        }
        const existingIcon = card.querySelector('.material-symbols-outlined');
        if (existingIcon) existingIcon.remove();
      });

      durationSecondary.forEach((btn) => {
        btn.classList.remove('bg-primary-fixed/40', 'shadow-[0_2px_8px_rgba(53,107,219,0.12)]');
        btn.classList.add('bg-surface-container-lowest', 'shadow-[0_2px_8px_rgba(0,0,0,0.03)]');
      });
    }

    durationCards.forEach((card) => {
      card.addEventListener('click', () => {
        resetDurationSelection();
        card.classList.remove('bg-surface-container-lowest', 'shadow-[0_2px_8px_rgba(0,0,0,0.03)]');
        card.classList.add('bg-primary-fixed/40', 'shadow-[0_2px_8px_rgba(53,107,219,0.12)]');
        const firstSpan = card.querySelector('span:first-child');
        const sub = card.querySelector('span:last-child');
        if (firstSpan) {
          firstSpan.classList.remove('text-on-surface');
          firstSpan.classList.add('text-on-primary-fixed');
        }
        if (sub) {
          sub.classList.remove('text-on-surface-variant');
          sub.classList.add('text-on-primary-fixed-variant');
        }
      });
    });

    durationSecondary.forEach((btn) => {
      btn.addEventListener('click', () => {
        resetDurationSelection();
        btn.classList.remove('bg-surface-container-lowest', 'shadow-[0_2px_8px_rgba(0,0,0,0.03)]');
        btn.classList.add('bg-primary-fixed/40', 'shadow-[0_2px_8px_rgba(53,107,219,0.12)]');
      });
    });

    const dateOptions = ['Today, Oct 23', 'Tomorrow, Oct 24', 'Monday, Oct 28'];
    let dateIdx = 0;
    const startDateBtn = document.getElementById('start-date-btn');
    const startDateLabel = document.getElementById('start-date-label');
    if (startDateBtn && startDateLabel) {
      startDateBtn.addEventListener('click', () => {
        dateIdx = (dateIdx + 1) % dateOptions.length;
        startDateLabel.textContent = dateOptions[dateIdx];
      });
    }

    const approachCards = document.querySelectorAll('.approach-card');
    approachCards.forEach((card) => {
      card.addEventListener('click', () => {
        approachCards.forEach((c) => {
          c.classList.remove('bg-primary-fixed/40', 'shadow-[0_2px_8px_rgba(53,107,219,0.12)]');
          c.classList.add('bg-surface-container-lowest', 'shadow-[0_2px_8px_rgba(0,0,0,0.03)]');
          const title = c.querySelector('div span:first-child');
          const sub = c.querySelector('div span:last-child');
          const icon = c.querySelector('.approach-check');
          if (title) {
            title.classList.remove('text-on-primary-fixed');
            title.classList.add('text-on-surface');
          }
          if (sub) {
            sub.classList.remove('text-on-primary-fixed-variant');
            sub.classList.add('text-on-surface-variant');
          }
          if (icon) {
            icon.textContent = 'radio_button_unchecked';
            icon.style.fontVariationSettings = "'FILL' 0";
            icon.classList.remove('text-primary');
            icon.classList.add('text-outline-variant');
          }
        });

        card.classList.remove('bg-surface-container-lowest', 'shadow-[0_2px_8px_rgba(0,0,0,0.03)]');
        card.classList.add('bg-primary-fixed/40', 'shadow-[0_2px_8px_rgba(53,107,219,0.12)]');
        const title = card.querySelector('div span:first-child');
        const sub = card.querySelector('div span:last-child');
        const icon = card.querySelector('.approach-check');
        if (title) {
          title.classList.remove('text-on-surface');
          title.classList.add('text-on-primary-fixed');
        }
        if (sub) {
          sub.classList.remove('text-on-surface-variant');
          sub.classList.add('text-on-primary-fixed-variant');
        }
        if (icon) {
          icon.textContent = 'check_circle';
          icon.style.fontVariationSettings = "'FILL' 1";
          icon.classList.remove('text-outline-variant');
          icon.classList.add('text-primary');
        }
      });
    });
  })();
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]"><div class="h-20 px-margin flex items-center justify-center"><button class="w-full max-w-sm h-12 rounded-xl bg-primary-container text-on-primary-container font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-[0_2px_8px_rgba(0,0,0,0.03)] active:scale-[0.98] transition-transform" type="button"><span>Continue</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button></div></footer></body></html>
